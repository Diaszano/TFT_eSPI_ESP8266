repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/Fonts/
      - id: end-of-file-fixer
        exclude: ^src/Fonts/
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^src/Fonts/
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: a9a8a861f30ed207ead7d5a3b7e8032283ba5da7  # frozen: v23.1.2
    hooks:
      - id: clang-format
        types_or: [file]
        files: '\.(c|cc|cpp|h|hpp|ino|inc|ipp)$'
        exclude: '^(User_Setup\.h$|src/Fonts/|src/TFT_Drivers/ST7789_Init\.h$|extras/Create_Smooth_Font/)'
        stages: [manual]
  - repo: local
    hooks:
      - id: format-check
        name: Verify formatter output without editing files
        entry: python3 scripts/format.py --check
        language: system
        types: [file]
        files: '\.(c|cc|cpp|h|hpp|ino|inc|ipp)$'
        exclude: '^(User_Setup\.h$|src/Fonts/|src/TFT_Drivers/ST7789_Init\.h$|extras/Create_Smooth_Font/)'
        stages: [manual]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks-system
        pass_filenames: false
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        pass_filenames: true
        additional_dependencies: ['@commitlint/config-conventional@21.2.3']
