name: Simulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: uv sync --locked --python "$(mise which python)"
      - name: Install FFmpeg for visual guide tests
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Configure sanitized native simulator
        run: cmake -S simulator -B .build/simulator/debug -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build .build/simulator/debug --parallel 2
      - name: CTest with ASan and UBSan
        run: ctest --test-dir .build/simulator/debug --output-on-failure
      - name: Python snapshot, CLI, and viewer tests
        run: uv run python3 -m unittest simulator.tests.test_snapshots simulator.tests.test_cli simulator.tests.test_viewer -v
      - name: Makefile integration tests
        run: uv run python3 -m unittest scripts.test_simulator_integration -v
      - name: Headless Makefile checks
        run: make sim-test
      - name: Deterministic rendering smoke test
        run: |
          make sim-render SCENE=edge_rect SEED=123 OUT=.build/simulator/runs/edge_rect-a
          make sim-render SCENE=edge_rect SEED=123 OUT=.build/simulator/runs/edge_rect-b
          cmp .build/simulator/runs/edge_rect-a/frame.rgb565 .build/simulator/runs/edge_rect-b/frame.rgb565
          cmp .build/simulator/runs/edge_rect-a/frame.png .build/simulator/runs/edge_rect-b/frame.png
      - name: Pixel mutation comparison regression
        run: uv run python3 -m unittest simulator.tests.test_snapshots.SnapshotEncodingTests.test_one_pixel_difference_reports_exact_coordinate_and_values -v
      - name: Retain bounded diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: simulator-failure-diagnostics
          path: |
            .build/simulator/runs/**/frame.png
            .build/simulator/runs/**/frame.rgb565
            .build/simulator/runs/**/manifest.json
            .build/simulator/runs/**/diff.png
            .build/simulator/runs/**/report.json
          if-no-files-found: ignore
          retention-days: 5
