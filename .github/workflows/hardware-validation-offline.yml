name: hardware-validation-offline

on: [push, pull_request]

permissions: {}

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: uv sync --locked --python "$(mise which python)"
      - run: make test-python
      - run: make test-hw-perf-offline
      - run: make test-native
      - run: make test-host
      - run: make test-compile
      - run: make test-hw-build
      - run: make test-host-extremes
