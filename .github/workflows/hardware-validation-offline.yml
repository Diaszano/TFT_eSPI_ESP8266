name: hardware-validation-offline

on: [push, pull_request]

permissions: {}

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: uv sync --locked --python "$(mise which python)"
      - run: make test-python
      - run: make test-hw-perf-offline
      - run: make test-native
      - run: make test-host
      - run: make test-compile
      - run: make test-hw-build
      - run: make test-host-extremes
