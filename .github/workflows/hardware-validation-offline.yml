name: hardware-validation-offline

on: [push, pull_request]

permissions: {}

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: uv sync --locked --python "$(mise which python)"
      - run: make test-python
      - run: make test-hw-perf-offline
      - run: make test-native
      - run: make test-host
      - run: make test-compile
      - run: make test-hw-build
      - run: make test-host-extremes
