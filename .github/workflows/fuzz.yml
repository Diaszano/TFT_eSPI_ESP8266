name: fuzz

on:
  schedule:
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: uv sync --locked --python "$(mise which python)"
      - name: Run scroll fuzzer campaign
        run: uv run python3 tests/host/run.py --case scroll --fuzz --fuzz-time 60 --fuzz-timeout 5
      - name: Run bounded extreme-coordinate fuzzer campaign
        run: uv run python3 tests/host/run.py --case extreme-coordinates --fuzz --fuzz-time 60 --fuzz-timeout 2
      - name: Run stateful graphics validation
        run: uv run python3 tests/host/run.py --case stateful-graphics
      - name: Upload crash and corpus artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-host-artifacts
          path: |
            .build/fuzz/scroll/
            .build/fuzz/extremes/
          if-no-files-found: ignore
