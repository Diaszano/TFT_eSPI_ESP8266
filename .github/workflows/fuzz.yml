name: fuzz

on:
  schedule:
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: uv sync --locked --python "$(mise which python)"
      - name: Run scroll fuzzer campaign
        run: uv run python3 tests/host/run.py --case scroll --fuzz --fuzz-time 60 --fuzz-timeout 5
      - name: Run bounded extreme-coordinate fuzzer campaign
        run: uv run python3 tests/host/run.py --case extreme-coordinates --fuzz --fuzz-time 60 --fuzz-timeout 2
      - name: Upload crash and corpus artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: fuzz-host-artifacts
          path: |
            .build/fuzz/scroll/
            .build/fuzz/extremes/
          if-no-files-found: ignore
