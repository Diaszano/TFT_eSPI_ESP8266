name: build

on: [push, pull_request]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('scripts/requirements-dev.txt', 'Makefile', 'library.json') }}
      - run: python -m pip install --require-hashes -r scripts/requirements-dev.txt
      - run: make build-Colour_Test
      - run: make build
      - run: make warnings
      - run: make test-compile
      - run: make layout-check
      - name: Check reference flash and RAM
        run: make size-check

  arduino-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARDUINO_CLI_VERSION: '1.3.1'
      ARDUINO_CLI_SHA256: '376428d7d45be640c00812a71612e1742edc2f5f9ee3742a2d6da7870e079588'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install verified Arduino CLI
        run: |
          archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSL "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}" -o "$archive"
          printf '%s  %s\n' "$ARDUINO_CLI_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/arduino-cli-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/arduino-cli-bin" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli-bin" >> "$GITHUB_PATH"
      - name: Install ESP8266 core 3.1.2
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
      - run: make build-arduino
