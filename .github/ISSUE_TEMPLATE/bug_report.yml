name: Bug report
description: Report a reproducible problem with the library or examples
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Library version
    validations:
      required: true
  - type: dropdown
    id: ide
    attributes:
      label: IDE
      options:
        - PlatformIO
        - Arduino IDE
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board and core version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: User_Setup.h diff or build_flags
    validations:
      required: true
  - type: textarea
    id: setup_output
    attributes:
      label: Read_User_Setup output
    validations:
      required: true
  - type: textarea
    id: sketch
    attributes:
      label: Minimal sketch and steps to reproduce
    validations:
      required: true
